<!doctype html>
<!--
  물리 시뮬레이터 실험실 — 새 시뮬레이터 시작용 최소 예제 (공통 틀 SimKit)
  쓰는 법: 이 파일을 sims/<slug>/index.html 로 복사 → 아래 인라인 스크립트 내용을 sims/<slug>/sim.js 로 옮기고
          <script src="sim.js"></script> 로 바꾼다. 경로 ../../shared/ 는 sims/<slug>/ 에서 맞는 경로다.
          (바로 열어 보려면 같은 내용이 들어 있는 sims/_template/index.html 을 연다)
  보여 주는 것: 단계 2개 · 슬라이더 1개(g) · 캔버스 공 튀기기 · 계기판 · 그래프 · 기록 표 · 프리셋 2개 · 수업 안내
  설명서: docs/SIMKIT.md
-->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>공 튀기기 (예제) — 물리 시뮬레이터 실험실</title>
  <link rel="stylesheet" href="../../shared/fonts.css">
  <link rel="stylesheet" href="../../shared/tokens.css">
  <link rel="stylesheet" href="../../shared/base.css">
  <link rel="stylesheet" href="../../shared/shell.css">
</head>
<body data-sim="projectile-energy">
  <div id="sim-root"></div>
  <script src="../../shared/sim.js"></script>
  <script>
  (function () {
    'use strict';

    // ---- 1. 화면 뼈대·루프 ----------------------------------------------------
    var H0 = 5;          // 떨어뜨리는 높이 (m) — 이 예제에서는 고정
    var E = 0.8;         // 튕김 비율 — 고정
    var T_END = 4;       // 4 초 뒤 끝
    var SCALE = 100;     // 1 m = 100 u (화면)
    var GROUND = 620;    // 땅의 y (u)
    var ball = { y: H0, v: 0 }, trail = [], firstHit = null, lastSample = -1;

    SimKit.init({
      slug: 'projectile-energy',
      title: '공 튀기기 (공통 틀 예제)',
      subject: '예제',
      unit: '공통 틀 시험',
      standards: ['(확인 필요)'],
      today: '중력 가속도가 작으면 공은 얼마나 늦게 떨어질까?',
      steps: ['예측', '실행'],          // 실제 시뮬레이터는 생략 → 기본 4단계(예측·실행·비교·정리)
      dt: 1 / 240,

      reset: function (p) {
        ball = { y: H0, v: 0 }; trail = []; firstHit = null; lastSample = -1;
      },
      step: function (dt, p) {
        ball.v -= p.g * dt;
        ball.y += ball.v * dt;
        if (ball.y <= 0) {
          ball.y = 0; ball.v = -ball.v * E;
          if (firstHit === null) firstHit = SimKit.time;
        }
        if (SimKit.time - lastSample >= 0.02) { trail.push([SimKit.time, ball.y]); lastSample = SimKit.time; }
        if (SimKit.time >= T_END) SimKit.finish('4 초 끝 — S 로 기록해 보세요');
      },
      render: function (view, p) {
        var ctx = view.ctx;
        // 땅
        ctx.fillStyle = SimKit.color('--color-paper-sunk');
        ctx.fillRect(0, GROUND, view.w, view.h - GROUND);
        ctx.strokeStyle = SimKit.color('--color-line-strong'); ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(0, GROUND); ctx.lineTo(view.w, GROUND); ctx.stroke();
        // 높이 눈금 (1 m 마다)
        ctx.fillStyle = SimKit.color('--color-ink-muted');
        ctx.font = '500 20px Pretendard, sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        for (var m = 0; m <= 5; m++) {
          ctx.fillText(m + ' m', 70, GROUND - m * SCALE);
          ctx.fillRect(80, GROUND - m * SCALE - 1, 20, 2);
        }
        // 직전 실행·기록의 높이-시간 선을 화면 오른쪽에 겹쳐 그리기 (t → x)
        function map(t, y) { return [300 + t * 220, GROUND - y * SCALE]; }
        SimKit.records.forEach(function (r) { SimKit.drawPath(ctx, r.series.y, SimKit.recStyle(r.slot), map); });
        if (SimKit.ghost) SimKit.drawPath(ctx, SimKit.ghost.series.y, SimKit.ghostStyle(), map);
        SimKit.drawPath(ctx, trail, { color: SimKit.color('--color-primary'), dash: [], width: 3 }, map);
        // 공
        var x = 200, y = GROUND - ball.y * SCALE - 20;
        ctx.fillStyle = SimKit.color('--color-sim-projectile');
        ctx.beginPath(); ctx.arc(x, y, 20, 0, Math.PI * 2); ctx.fill();
        // 속도 화살표 (1 m/s = 12 u)
        SimKit.arrow(ctx, x, y, x, y - ball.v * 12, { color: '--color-q-velocity', width: 5, label: 'v' });
        // 계기판·그래프 갱신
        meters.update({ t: SimKit.time, y: ball.y, v: ball.v });
        graph.draw({ y: trail });
      },
      capture: function (p) {
        if (!trail.length) return null;
        return { series: { y: trail.slice() }, values: { t1: firstHit } };
      },
      save: function () { return { y: ball.y, v: ball.v, n: trail.length, f: firstHit, s: lastSample }; },
      load: function (s) { ball.y = s.y; ball.v = s.v; trail.length = s.n; firstHit = s.f; lastSample = s.s; },
      status: function (p) { return 'g = ' + SimKit.valueText('g', p.g) + ' m/s² · 높이 5 m 고정'; }
    });

    // ---- 2. 수치 바꾸기 (요구 A) -----------------------------------------------
    SimKit.addVar('values', {
      key: 'g', label: '중력 가속도', symbol: 'g', unit: 'm/s²',
      min: 1, max: 25, step: 0.1, value: 9.8, decimals: 1, precision: 2,
      ticks: [1.6, 9.8, 24.8], apply: 'restart'
    });
    // 상황 바꾸기 예 (요구 B) — 실제 시뮬레이터에서는 3가지 이상:
    // SimKit.addChoice('situation', { key: 'planet', label: '어디에서?', options: [{value:'earth',label:'지구'},{value:'moon',label:'달'}], value: 'earth' });
    // SimKit.addToggle('tools', { key: 'showV', label: '속도 화살표', value: true });

    // ---- 3. 하단 띠: 계기판 · 그래프 · 기록 표 (요구 C) --------------------------
    var meters = SimKit.meters(null, [
      { key: 't', label: '시간', symbol: 't', unit: 's', decimals: 2 },
      { key: 'y', label: '높이', symbol: 'y', unit: 'm', decimals: 2 },
      { key: 'v', label: '속도', symbol: 'v', unit: 'm/s', decimals: 1, q: 'velocity' }
    ]);
    var graph = SimKit.graph(null, {
      title: '높이-시간',
      x: { label: 't', unit: 's', min: 0, max: 4 },
      y: { label: 'y', unit: 'm', min: 0, max: 5 },
      series: [{ key: 'y', label: '높이', color: '--color-primary' }]
    });
    SimKit.recordTable(null, {
      columns: [
        { key: 'g', from: 'param' },
        { key: 't1', label: '첫 바닥', unit: 's', decimals: 2, from: 'value' }
      ]
    });

    // ---- 4. 프리셋 (교사가 한 번에 상황 세팅) -------------------------------------
    SimKit.setPresets([
      { name: '지구에서', tag: '탐구 재현', change: 'g = 9.8', fixed: '높이 5 m', values: { g: 9.8 } },
      { name: '달에서', tag: '대표 문항', change: 'g = 1.6', fixed: '높이 5 m',
        values: { g: 1.6 },
        predict: { question: '달에서는 첫 바닥까지 걸리는 시간이 지구의 몇 배일까?', choices: ['같다', '약 2.5배', '약 6배'] } }
    ]);

    // ---- 5. 수업 안내 서랍 (요구 D 대응표) ----------------------------------------
    SimKit.guide({
      rows: [{ target: 'g (중력 가속도)', standard: '(예제) (확인 필요)', discover: 'g 가 작을수록 떨어지는 시간이 길다 (t = √(2h/g))', misconception: '무거운 곳이 더 빨리 떨어진다' }]
    });
  })();
  </script>
</body>
</html>
