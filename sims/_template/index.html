<!doctype html>
<!--
  물리 시뮬레이터 실험실 — 새 시뮬레이터 시작용 최소 예제 (공통 틀 SimKit, R2 2026-10-28)
  쓰는 법: 이 파일을 sims/<slug>/index.html 로 복사 → 아래 인라인 스크립트 내용을 sims/<slug>/sim.js 로 옮기고
          <script src="sim.js"></script> 로 바꾼다. 경로 ../../shared/ 는 sims/<slug>/ 에서 맞는 경로다.
          (바로 열어 보려면 같은 내용이 들어 있는 sims/_template/index.html 을 연다)
  보여 주는 것(R2): 지금 할 일(stepTasks, 25자 안팎·실행 버튼 없음) · 슬라이더 1개(g, ticks {v,label}) · 상황 1개 · 캔버스 공 튀기기 ·
          계기판 1줄 · 그래프 · 기록 표(priority 1~3, extra 자리) · 실험 카드 2개(changes 아래 줄 · 누르면 값 바로 적용 → 예측 창 자동) ·
          숫자 예측(max 함수·example) · 예측 창이 떠 있는 동안 결과 층 숨기기(SK.predicting) · 도움말(concepts 새 구조 · terms alias · inlineTerms) ·
          결과 해설(takeaway {line, more} → 패널 맨 위 카드) · 정리 질문(think id/when · hint 접힘) · 수업 안내(교사)
  설명서: docs/SIMKIT.md
-->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>공 튀기기 (예제) — 물리 시뮬레이터 실험실</title>
  <link rel="stylesheet" href="../../shared/fonts.css">
  <link rel="stylesheet" href="../../shared/tokens.css">
  <link rel="stylesheet" href="../../shared/base.css">
  <link rel="stylesheet" href="../../shared/shell.css">
</head>
<body data-sim="projectile-energy">
  <div id="sim-root"></div>
  <script src="../../shared/sim.js"></script>
  <script>
  (function () {
    'use strict';
    var SK = SimKit;

    // ---- 1. 화면 뼈대·루프 ----------------------------------------------------
    var H0 = 5;          // 떨어뜨리는 높이 (m) — 이 예제에서는 고정
    var E = 0.8;         // 튕김 비율 — 고정
    var T_END = 4;       // 4 초 뒤 끝
    var SCALE = 100;     // 1 m = 100 u (화면)
    var GROUND = 600;    // 땅의 y (u)
    var ball = { y: H0, v: 0 }, trail = [], firstHit = null, lastSample = -1;

    SK.init({
      slug: 'projectile-energy',
      title: '공 튀기기 (공통 틀 예제)',
      subject: '예제', unit: '공통 틀 시험', standards: ['(확인 필요)'],
      today: '중력 가속도가 작으면 공은 얼마나 늦게 떨어질까?',
      // 단계 이름은 예측·실행·비교·정리 고정. 단계마다 '지금 할 일' 문장(action 을 비우면 공통 버튼이 상황에 맞게 바뀜)
      stepTasks: [
        // R2: 문장 25자 안팎. '실행'은 하단 ▶ 실행 하나라서 action 에 실행을 넣지 않는다(넣어도 띠에는 안 뜸)
        { text: '첫 바닥까지 몇 초일지 먼저 예측해요' },
        null,  // 실행: 공통 문장('아래 ▶ 실행을 눌러요' → 끝나면 '기록하기 버튼으로 결과를 저장해요')
        { text: 'g 만 바꿔 두 번 기록하고 비교해요' },
        null   // 정리: 공통 문장
      ],
      autoPredict: true,   // 기본값. 카드·모드를 고르면 예측 창이 자동으로 (교사 모드 › 수업 안내에서 끌 수 있음)
      onPredictOpen: function () { SK.requestRender(); },   // 예측 창이 떠 있는 동안 결과 층을 숨기려면 render 에서 SK.predicting() 을 본다
      onPredictClose: function () { SK.requestRender(); },
      dt: 1 / 240,
      reset: function (p) { ball = { y: H0, v: 0 }; trail = []; firstHit = null; lastSample = -1; },
      step: function (dt, p) {
        ball.v -= p.g * dt;
        ball.y += ball.v * dt;
        if (ball.y <= 0) {
          ball.y = 0; ball.v = -ball.v * E;
          if (firstHit === null) firstHit = SK.time;
        }
        if (SK.time - lastSample >= 0.02) { trail.push([SK.time, ball.y]); lastSample = SK.time; }
        if (SK.time >= T_END) SK.finish('4초 끝 — 기록하기 버튼으로 저장해요');   // 끝 안내는 띠 문장으로 간다(토스트 아님)
      },
      render: function (view, p) {
        var ctx = view.ctx;
        ctx.fillStyle = SK.color('--color-paper-sunk');
        ctx.fillRect(0, GROUND, view.w, view.h - GROUND);
        ctx.strokeStyle = SK.color('--color-line-strong'); ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(0, GROUND); ctx.lineTo(view.w, GROUND); ctx.stroke();
        ctx.fillStyle = SK.color('--color-ink-muted');
        ctx.font = '500 22px Pretendard, sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';   // R2: 캔버스 글자 22u 이상
        for (var m = 0; m <= 5; m++) { ctx.fillText(m + ' m', 70, GROUND - m * SCALE); ctx.fillRect(80, GROUND - m * SCALE - 1, 20, 2); }
        function map(t, y) { return [300 + t * 220, GROUND - y * SCALE]; }
        SK.records.forEach(function (r) { SK.drawPath(ctx, r.series.y, SK.recStyle(r.slot), map); });
        if (SK.ghost) SK.drawPath(ctx, SK.ghost.series.y, SK.ghostStyle(), map);
        // R2: 예측 창이 떠 있는 동안에는 결과 층(지금 궤적)을 숨긴다 — 카드를 누르면 값이 먼저 바뀌기 때문
        if (!SK.predicting()) SK.drawPath(ctx, trail, { color: SK.color('--color-primary'), dash: [], width: 3 }, map);
        var x = 200, y = GROUND - ball.y * SCALE - 20;
        // 값을 바꾸면 SK.isFlashing('g') 가 잠깐 참 → 공 테두리를 강조
        if (SK.isFlashing('g')) { ctx.strokeStyle = SK.color('--color-focus'); ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(x, y, 30, 0, Math.PI * 2); ctx.stroke(); }
        ctx.fillStyle = SK.color('--color-sim-projectile');
        ctx.beginPath(); ctx.arc(x, y, 20, 0, Math.PI * 2); ctx.fill();
        SK.arrow(ctx, x, y, x, y - ball.v * 12, { color: '--color-q-velocity', width: 5 });
        // 라벨이 겹치면 SK.placeLabel 이 위/아래로 밀고 흰 칩을 깐다
        SK.placeLabel(ctx, [
          { x: x + 40, y: y, text: '공 (높이 ' + SK.fmt(ball.y, 1) + ' m)', anchor: 'left' },
          { x: x + 40, y: y + 6, text: '속도 ' + SK.fmt(ball.v, 1) + ' m/s', anchor: 'left', color: '--color-q-velocity' }
        ]);
        meters.update({ t: SK.time, y: ball.y, v: ball.v });
        graph.draw({ y: trail });
      },
      capture: function (p) {
        if (!trail.length) return null;
        return { series: { y: trail.slice() }, values: { t1: firstHit } };
      },
      save: function () { return { y: ball.y, v: ball.v, n: trail.length, f: firstHit, s: lastSample }; },
      load: function (s) { ball.y = s.y; ball.v = s.v; trail.length = s.n; firstHit = s.f; lastSample = s.s; },
      // 상태 칩: 배열로 (칩 하나에 한 덩어리)
      status: function (p) { return [p.place === 'moon' ? '달' : '지구', 'g ' + SK.valueText('g', p.g), '높이 5 m 고정']; }
    });

    // ---- 2. 수치 바꾸기 (요구 A) — 핵심 2~3개를 'values' 에, 나머지는 'deep' ---------------
    SK.addVar('values', {
      key: 'g', label: '{{중력 가속도}}', symbol: 'g', unit: 'm/s²',
      min: 1, max: 25, step: 0.1, value: 9.8, decimals: 1, precision: 2,
      ticks: [{ v: 1.6, label: '달' }, { v: 9.8, label: '지구' }, { v: 24.8, label: '목성' }], apply: 'restart'
    });
    // 상황 바꾸기 (요구 B)
    SK.addChoice('situation', { key: 'place', label: '어디에서?', value: 'earth', apply: 'restart', record: false,   // g 를 대신 고르는 선택이라 기록 비교에서는 뺌
      options: [{ value: 'earth', label: '지구', sub: 'g 9.8' }, { value: 'moon', label: '달', sub: 'g 1.6' }],
      onChange: function (v) { SK.set('g', v === 'moon' ? 1.6 : 9.8); } });

    // ---- 3. 하단 띠: 계기판 1줄 · 그래프 (기록 표는 비교 단계에 오른쪽 큰 판) ------------------
    var meters = SK.meters(null, [
      { key: 't', label: '시간', symbol: 't', unit: 's', decimals: 2 },
      { key: 'y', label: '높이', symbol: 'y', unit: 'm', decimals: 2 },
      { key: 'v', label: '속도', symbol: 'v', unit: 'm/s', decimals: 1, q: 'velocity' }
    ]);
    var graph = SK.graph(null, {
      title: '높이-시간', empty: '높이 그래프',
      x: { label: 't', unit: 's', min: 0, max: 4 },
      y: { label: 'y', unit: 'm', min: 0, max: 5 },
      series: [{ key: 'y', label: '높이', color: '--color-primary' }]
    });
    SK.recordTable(null, {
      columns: [
        { key: 'g', from: 'param', priority: 1 },
        { key: 't1', label: '첫 바닥', unit: 's', decimals: 2, from: 'value', changed: true, priority: 1 },
        { key: 'place', label: '장소', from: 'param', priority: 3, text: function (r) { return r.params.g < 5 ? '달' : '지구'; } }   // 3 = '열 더 보기' 에서만
      ],
      extra: SK.h('p', { class: 'var__hint', text: '(예제) 큰 표 아래 시뮬레이터 전용 자리 — recordTable({extra}) 로 붙여요.' })
    });

    // ---- 4. 실험 카드 (이름 12자 이내 · 예측은 answer/why 필수) ---------------------------------
    SK.setPresets([
      // R2: changes = 카드 아래 줄(바꾸는 값, 짧게) · change/fixed = 말풍선 설명 · mode = '○○ 모드로 바뀌어요' 토스트
      { name: '지구에서', tag: '탐구 재현', changes: 'g 9.8', change: 'g = 9.8', fixed: '높이 5 m', values: { place: 'earth', g: 9.8 },
        predict: { question: '지구에서 5 m 높이의 공은 몇 초 뒤 처음 바닥에 닿을까?',
          numeric: { label: '몇 초 뒤에 닿을까?', unit: 's', min: 0, max: function (p) { return 3 * Math.sqrt(10 / p.g); }, example: 1, key: 't1', decimals: 2, tolerance: 0.1 },
          why: '5 = ½ × 9.8 × t² 이라서 t ≈ 1.01 s', afterHint: '예측했어요 — ▶ 실행으로 확인해요' } },
      { name: '달에서', tag: '대표 문항', changes: 'g 9.8 → 1.6', change: 'g = 1.6', fixed: '높이 5 m', values: { place: 'moon', g: 1.6 },
        predict: { question: '달에서는 첫 바닥까지 걸리는 시간이 지구의 몇 배일까?', choices: ['같다', '약 2.5배', '약 6배'],
          answer: 2, why: 't = √(2h/g) 이라서 g 가 1/6 이면 시간은 √6 ≈ 2.5배' } }
    ]);

    // ---- 5. 설명 도우미 (? 도움말 · 용어 말풍선 · 결과 해설 · 정리 질문) ------------------------
    SK.help({
      inlineTerms: true,   // {{용어}} 첫 등장 뒤에 '(짧은 풀이)' 자동
      how: ['아래 실험 카드를 누르면 값이 바뀌고 예측 질문이 나와요.', '아래 ▶ 실행으로 공이 처음 바닥에 닿는 시간을 봐요.', '기록하기 버튼으로 저장한 뒤 g 만 바꿔 다시 실행해요.', '비교 단계 표에서 첫 바닥 시간이 어떻게 달라졌는지 찾아요.'],
      // R2 개념 카드: summary(한 줄) → plain(\n 줄바꿈) → example → figure → [식 보기](formula+symbols) → [왜 그럴까?](why) → live
      concepts: [{ title: '떨어지는 시간', summary: 'g 가 작을수록 더 오래 걸려요',
        plain: '높이가 같으면 g 가 작을수록 천천히 빨라져요.\n그래서 바닥까지 더 오래 걸려요.',
        example: '달(g 1.6)에서는 지구보다 약 2.5배 오래 걸려요.',
        formula: 't = √(2h / g)', symbols: [{ s: 't', meaning: '첫 바닥까지 걸린 시간', unit: 's' }, { s: 'h', meaning: '떨어뜨린 높이', unit: 'm' }, { s: 'g', meaning: '{{중력 가속도}}', unit: 'm/s²' }],
        why: 'h = ½ g t² 에서 t 를 구하면 t = √(2h/g) 예요.\n그래서 g 가 4배면 t 는 ½배가 돼요.',
        live: function (p) { return 't = √(2 × 5 / ' + SK.valueText('g', p.g) + ') = ' + SK.fmt(Math.sqrt(10 / p.g), 2) + ' s'; } }],
      // R2: terms 는 문자열 또는 {def, short(괄호 풀이), alias(같은 말)} — 넣은 순서대로 보임
      terms: { '중력 가속도': { def: '1초마다 떨어지는 속력이 얼마나 빨라지는지(m/s²). 지구 9.8, 달 1.6', short: '1초마다 빨라지는 정도', alias: ['g'] } }
    });
    // R2: {line(한 줄), more('왜 그럴까?' 안 전문)} — 문자열을 돌려주면 한 줄로
    SK.takeaway(function (p) { return { line: 'g 가 작을수록 첫 바닥까지 더 오래 걸려요.', more: 'g ' + SK.valueText('g', p.g) + ' m/s² 에서 첫 바닥까지 ' + SK.fmt(firstHit, 2) + ' s 걸렸어요. t = √(2h/g) 라서 g 가 작으면 t 가 커져요.' }; });
    SK.think({ id: 'g4', q: 'g 가 4배가 되면 첫 바닥까지 걸리는 시간은?', choices: ['4배', '2배', '½배', '¼배'], answer: 3,
      why: 't = √(2h/g) 라서 g 가 4배면 t 는 1/√4 = ½배예요.' });
    // 보기 없는 계산형 → hint 는 '힌트 보기' 로 접힘
    SK.think({ id: 'calc', q: '달(g 1.6)에서 5 m 높이 공은 몇 초 뒤 바닥에 닿을까?', hint: 't = √(2h ÷ g) 에 넣어 봐요', reveal: '√(10 ÷ 1.6) ≈ 2.5 s' });
    // 모드별로 숨기려면 when: () => 모드 === '…' · 지우기 SK.think.remove('mass')
    SK.think({ id: 'mass', q: '공의 질량을 두 배로 하면 떨어지는 시간은 어떻게 될까? 이유도 말해 봐요.', reveal: '그대로예요. 공기 저항이 없으면 떨어지는 시간은 질량과 관계없어요.',
      when: function () { return true; } });

    // ---- 6. 수업 안내(교사) — 교사 모드(?teacher=1 또는 H 3초)에서만 ------------------------------
    SK.guide({
      rows: [{ target: 'g (중력 가속도)', standard: '(예제) (확인 필요)', discover: 'g 가 작을수록 떨어지는 시간이 길다 (t = √(2h/g))', misconception: '무거운 곳이 더 빨리 떨어진다' }]
    });
  })();
  </script>
</body>
</html>
