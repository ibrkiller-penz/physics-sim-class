<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>물리 시뮬레이터 실험실</title>
  <link rel="stylesheet" href="shared/fonts.css">
  <link rel="stylesheet" href="shared/tokens.css">
  <link rel="stylesheet" href="shared/base.css">
  <script src="shared/icons.js"></script>
  <style>
    /* 허브 표지 전용 (1920×1080, 단위 u) — R2: docs/개선/R2_계획.md §3 F */
    .hub { display: grid; grid-template-rows: calc(80 * var(--u)) auto minmax(0, 1fr) calc(72 * var(--u)); padding: 0 calc(80 * var(--u)); }
    .hub-nav { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--color-line); }
    .hub-nav .menu__name { font-size: var(--fs-meta); color: var(--color-ink); }
    .hub-nav__right { position: relative; display: flex; gap: var(--space-2); }
    .hub-nav__right .btn { min-height: calc(52 * var(--u)); padding: 0 var(--space-4); font-size: var(--fs-meta); border-width: calc(2 * var(--u)); }
    .hub-keys {
      position: absolute; right: 0; top: calc(100% + var(--space-2)); z-index: 20; width: calc(560 * var(--u));
      display: grid; grid-template-columns: auto 1fr; gap: var(--space-2) var(--space-4); align-items: baseline;
      padding: var(--space-5); border-radius: var(--radius-lg);
      background: var(--color-paper-raised); border: 1px solid var(--color-line-strong); box-shadow: var(--shadow-lg);
      font: var(--font-weight-medium) var(--fs-meta)/1.4 var(--font-sans);
    }
    .hub-keys[hidden] { display: none; }
    @media (pointer: coarse) { .hub-keys__btn { display: none !important; } }
    .hub-head { padding: calc(28 * var(--u)) 0 calc(24 * var(--u)); display: grid; gap: var(--space-3); }
    .hub-title { font: var(--font-weight-black) calc(64 * var(--u))/1.15 var(--font-serif); letter-spacing: -0.02em; word-break: keep-all; }
    .hub-title span { color: var(--color-primary); }
    .hub-sub { font: var(--font-weight-medium) var(--fs-body)/1.5 var(--font-sans); color: var(--color-ink); word-break: keep-all; }
    .hub-sub small { display: block; margin-top: var(--space-1); font-size: var(--fs-meta); font-weight: var(--font-weight-light); color: var(--color-ink-muted); }   /* R4: 24u · 300 */
    .cards { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; gap: calc(24 * var(--u)); min-height: 0; padding-bottom: calc(24 * var(--u)); }
    .card {
      position: relative; display: flex; flex-direction: column; gap: var(--space-3);
      min-height: 0; height: 100%; max-height: calc(700 * var(--u));   /* R4 마무리: 16:9 는 칸(≈686u)을 그대로 채우고, 세로가 긴 화면은 700u 에서 멈춰 가운데 (카드 속 빈 공간 방지) */
      padding: calc(26 * var(--u)) var(--space-5) var(--space-5);
      border-radius: var(--radius-lg);
      background: var(--color-paper-raised);
      border: 1px solid var(--color-line);
      box-shadow: var(--shadow-sm);
      transition: border-color var(--dur-fast) var(--dur-ease), transform var(--dur-fast) var(--dur-ease), box-shadow var(--dur-fast) var(--dur-ease);
    }
    .card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: calc(6 * var(--u)); border-radius: var(--radius-lg) var(--radius-lg) 0 0; background: var(--sim); }
    html:not(.cursor-hidden) .card:hover, .card:focus-within { border-color: var(--sim); box-shadow: var(--shadow-md); transform: translateY(calc(-3 * var(--u))); }
    .card__top { align-self: stretch; display: flex; align-items: center; gap: var(--space-2); flex-wrap: nowrap; min-height: calc(48 * var(--u)); }
    .card__key {
      display: grid; place-items: center; width: calc(48 * var(--u)); height: calc(48 * var(--u)); flex: none;
      border-radius: var(--radius-md); background: var(--sim); color: var(--color-paper);
      font: var(--font-weight-bold) var(--fs-h3)/1 var(--font-num);
    }
    /* 색약 보조: 번호 옆 모양 기호 ●▲■◆★ */
    .card__mark { display: inline-grid; place-items: center; width: calc(28 * var(--u)); height: calc(28 * var(--u)); font: var(--font-weight-black) calc(22 * var(--u))/1 var(--font-sans); color: var(--sim); }
    .card__first { margin-left: auto; padding: var(--space-1) var(--space-2); border-radius: var(--radius-pill); background: var(--color-ok-tint); color: var(--color-ok-text); font: var(--font-weight-bold) var(--fs-caption)/1.2 var(--font-sans); white-space: nowrap; }
    .card__title { font: var(--font-weight-bold) calc(32 * var(--u))/1.3 var(--font-serif); color: var(--color-ink); word-break: keep-all; min-height: calc(2 * 1.3 * 32 * var(--u)); text-wrap: balance; white-space: pre-line; }
    /* 가운데: 선화 아이콘 + 무엇을 하나요 2줄 + 순서·시간 */
    .card__mid { flex: 1 1 auto; min-height: 0; display: grid; align-content: start; justify-items: center; gap: var(--space-3); }
    .card__icon { width: calc(120 * var(--u)); height: calc(84 * var(--u)); color: var(--sim); }
    .card__icon svg { width: 100%; height: 100%; display: block; }
    .card__q { width: 100%; min-height: calc(3 * 1.45 * var(--fs-meta)); font: var(--font-weight-medium) var(--fs-meta)/1.45 var(--font-sans); color: var(--color-ink); word-break: keep-all; text-wrap: balance; }
    .card__q::before { content: "“"; color: var(--sim-text); font-weight: var(--font-weight-bold); }
    .card__q::after { content: "”"; color: var(--sim-text); font-weight: var(--font-weight-bold); }
    .card__what { width: 100%; display: grid; gap: calc(2 * var(--u)); font: var(--font-weight-medium) var(--fs-caption)/1.4 var(--font-sans); color: var(--color-ink-chip); word-break: keep-all; }
    .card__what b { font: var(--font-weight-bold) var(--fs-caption)/1.2 var(--font-sans); color: var(--sim-text); }
    .card__flow { width: 100%; font: var(--font-weight-semibold) var(--fs-caption)/1.3 var(--font-sans); color: var(--color-ink-chip); word-break: keep-all; }
    .card__subj { align-self: flex-start; padding: var(--space-1) var(--space-3); border-radius: var(--radius-pill); background: var(--sim-tint); color: var(--sim-text); font: var(--font-weight-semibold) var(--fs-caption)/1.3 var(--font-sans); word-break: keep-all; }
    .card__go { margin-top: auto; display: grid; gap: var(--space-2); }
    .card__open {
      display: flex; align-items: center; justify-content: center; gap: var(--space-3);
      min-height: var(--tap); border-radius: var(--radius-md);
      border: calc(3 * var(--u)) solid var(--sim); color: var(--color-paper); background: var(--sim);
      font: var(--font-weight-bold) var(--fs-body)/1 var(--font-sans);
    }
    .card__open .ico { width: calc(28 * var(--u)); height: calc(28 * var(--u)); margin-left: calc(-4 * var(--u)); }
    /* R7: [설명부터 ▸](주색) [바로 실험](윤곽) · 칩 '① 설명 N장 → ② 실험 5가지' · 읽은 장 점 */
    .card__open--sim { min-height: calc(56 * var(--u)); color: var(--sim-text); background: var(--color-paper-raised); border-width: calc(2 * var(--u)); font-weight: var(--font-weight-medium); font-size: var(--fs-meta); }
    html:not(.cursor-hidden) .card__open--sim:hover { background: var(--sim-tint); filter: none; }
    .card__steps { width: 100%; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: var(--space-1) var(--space-2); font: var(--font-weight-medium) var(--fs-caption)/1.3 var(--font-sans); color: var(--sim-text); }
    .card__steps span { padding: calc(4 * var(--u)) var(--space-2); border-radius: var(--radius-pill); background: var(--sim-tint); white-space: nowrap; }
    .card__steps i { font-style: normal; color: var(--color-line-strong); }
    .card__seen { display: flex; align-items: center; justify-content: center; gap: calc(6 * var(--u)); min-height: calc(24 * var(--u)); font: var(--font-weight-regular) var(--fs-caption)/1 var(--font-sans); color: var(--color-ink-muted); }
    .card__seen[hidden] { display: none; }
    /* R7: 카드 안 칸이 늘어 16:9 는 아이콘·간격을 줄인다(카드 5장 높이 같음) · 링크 줄은 있는 카드만 */
    .card { gap: var(--space-2); }
    .card__mid { gap: var(--space-2); }
    .card__icon { height: calc(56 * var(--u)); width: calc(96 * var(--u)); }
    .card__q { min-height: 0; }
    /* 링크 줄은 빈 카드도 같은 높이로 남겨 다섯 카드의 [설명부터][바로 실험] 바닥선을 맞춘다 (팀장 R7 마무리) */
    .card__go { gap: var(--space-2); }
    @media (orientation: portrait) and (min-width: 601px) { .cards { grid-auto-rows: 1fr; } }
    @media (orientation: landscape) { .card__icon { display: none; } }   /* 가로: 선화 아이콘 대신 설명→실험 칩 자리 */
    .card__steps { flex-wrap: nowrap; gap: var(--space-1); }
    .card__steps span { padding: calc(3 * var(--u)) calc(6 * var(--u)); }
    .card__seen i { width: calc(12 * var(--u)); height: calc(12 * var(--u)); min-width: 6px; min-height: 6px; border-radius: 50%; border: calc(2 * var(--u)) solid var(--sim); }
    .card__seen i.is-seen { background: var(--sim); }
    .card__links a .ico { width: 1em; height: 1em; margin-left: calc(2 * var(--u)); }
    .card__links { min-height: calc(44 * var(--u)); display: flex; flex-wrap: wrap; gap: 0 var(--space-4); justify-content: center; margin-top: 0; }
    .card__links a {
      display: inline-flex; align-items: center; min-height: calc(44 * var(--u));
      font: var(--font-weight-semibold) var(--fs-caption)/1.25 var(--font-sans); color: var(--sim-text);
      text-decoration: underline; text-underline-offset: calc(4 * var(--u)); word-break: keep-all;
    }
    html:not(.cursor-hidden) .card__open:hover { filter: brightness(0.92); }
    /* 성취기준 코드는 교사 모드(?teacher=1 · 오른쪽 위 [교사 모드])에서만 — R5: 칩 모양 */
    .card__std { display: none; justify-self: center; align-items: center; min-height: calc(34 * var(--u)); padding: 0 var(--space-3); border-radius: var(--radius-pill); background: var(--sim-tint); color: var(--sim-text); font: var(--font-weight-medium) var(--fs-caption)/1.2 var(--font-num); text-align: center; white-space: nowrap; }
    html.is-teacher .card__std { display: inline-flex; }
    /* R5: 교사 모드 토글 (켜면 모든 [열기]·보조 링크가 ?teacher=1) */
    .hub-teacher[aria-pressed="true"] { background: var(--color-primary-tint); border-color: var(--color-primary); color: var(--color-primary); }
    .hub-teacher .hub-teacher__state { font-weight: var(--font-weight-regular); color: var(--color-ink-muted); }
    /* R6(S9): [심플 | 자세히] 분절 — 교사 모드 칩 왼쪽. 고르면 5장 카드의 [열기]·보조 링크가 ?simple=1 (자세히면 뺌) */
    .hub-nav__right { align-items: center; }
    .hub-mode { height: calc(64 * var(--u)); }
    .hub-mode .mode-seg__opt { min-width: calc(128 * var(--u)); font-size: var(--fs-meta); }
    .hub-nav__right .hub-teacher, .hub-nav__right .hub-keys__btn { min-height: calc(64 * var(--u)); }
    /* 심플을 고르면 [열기] 안 왼쪽에 작은 칩 '심플' */
    .card__simple { display: none; padding: calc(3 * var(--u)) var(--space-3); border-radius: var(--radius-pill); background: var(--color-paper); color: var(--sim-text); font: var(--font-weight-medium) var(--fs-caption)/1.2 var(--font-sans); white-space: nowrap; }
    html.is-simple .card__simple { display: inline-block; }
    /* R6: 교사 모드 성취기준 칩이 카드 폭을 넘지 않게(두 코드면 두 줄) */
    .card__std { max-width: 100%; white-space: normal; padding-top: calc(3 * var(--u)); padding-bottom: calc(3 * var(--u)); }
    .card__go { min-width: 0; }
    /* R6(S10): 카드 2 보조 링크 = 44u 터치 칩 '빛 실험' '전자 실험' (다른 카드도 같은 높이의 빈 줄) */
    .card__links { gap: var(--space-2); align-items: center; flex-wrap: nowrap; }
    .card__links a.card__chip {
      flex: 0 1 auto; min-width: 0; white-space: nowrap;
      min-height: calc(44 * var(--u)); padding: 0 var(--space-2) 0 var(--space-3); gap: 0;
      border-radius: var(--radius-pill); border: calc(2 * var(--u)) solid var(--sim); background: var(--sim-tint);
      text-decoration: none; color: var(--sim-text); font-weight: var(--font-weight-medium);
    }
    html:not(.cursor-hidden) .card__links a.card__chip:hover { background: var(--color-paper-raised); }
    .hub-teacher[aria-pressed="true"] .hub-teacher__state { color: var(--color-primary); font-weight: var(--font-weight-bold); }

    /* R5: 가로 4:3 태블릿(1180×820·1024×768 — 16:9 보다 세로가 긴 가로 화면): 제목·카드를 가운데로 모으고
       제목 아래·카드 아래 여백은 24u. 남는 세로는 위(메뉴 아래)와 아래(바닥 줄 위)로 똑같이 나눈다. 16:9 는 이 규칙 밖 */
    @media (orientation: landscape) and (max-aspect-ratio: 17/10) {
      .hub { grid-template-rows: calc(80 * var(--u)) minmax(0, 1fr) auto auto minmax(0, 1fr) calc(72 * var(--u)); }
      .hub-nav { grid-row: 1; } .hub-head { grid-row: 3; padding-bottom: calc(24 * var(--u)); } .cards { grid-row: 4; } .hub-foot { grid-row: 6; }
      .cards { align-items: stretch; padding-bottom: calc(24 * var(--u)); }
      .card { height: auto; }
    }
    /* R5: 세로 태블릿(폭 601 이상): 카드 2열, 카드 높이는 내용만큼, 넘치면 카드 칸 안에서 스크롤 */
    @media (orientation: portrait) and (min-width: 601px) {
      /* R6(S10): 카드 칸 높이를 고정하지 않고 페이지가 스크롤 — 5번 카드 [열기] 가 잘리거나 푸터와 겹치지 않게. 푸터는 흐름 안 */
      html, body { height: auto; min-height: 100%; overflow-x: hidden; overflow-y: auto; }
      .app { height: auto; min-height: 100vh; overflow: visible; }
      .slide.hub { height: auto; min-height: 100vh; overflow: visible; }
      .hub { padding: 0 calc(40 * var(--u)); grid-template-rows: calc(88 * var(--u)) auto auto auto; }
      .hub-title { font-size: calc(60 * var(--u)); }
      .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: max-content; align-items: stretch; align-content: start; overflow: visible; padding: calc(8 * var(--u)) calc(4 * var(--u)) calc(32 * var(--u)); }
      .card { height: auto; max-height: none; }
      .card__q { min-height: 0; }
      .hub-foot { flex-wrap: wrap; gap: var(--space-1) var(--space-4); padding: calc(20 * var(--u)) 0 calc(28 * var(--u)); }
      .hub-nav__right { gap: var(--space-2); }
      .hub-mode .mode-seg__opt { min-width: calc(110 * var(--u)); padding: 0 var(--space-3); }
    }
    .hub-foot { display: flex; align-items: center; justify-content: center; gap: var(--space-4); border-top: 1px solid var(--color-line); font: var(--font-weight-semibold) var(--fs-meta)/1.4 var(--font-sans); color: var(--color-ink-muted); }
    .hub-foot__credit { font-weight: var(--font-weight-regular); }
    .flow { display: flex; align-items: center; gap: var(--space-3); }
    .flow b { display: inline-flex; align-items: center; gap: var(--space-2); color: var(--color-ink); }
    .flow i { font-style: normal; color: var(--color-line-strong); }
    .flow .circ { font-size: var(--fs-caption); color: var(--color-ink-muted); }
    /* R7-2(S14): 머리줄 [심플|자세히] + ⋯ (교사 모드·키보드 안내 팝오버) */
    .hub-more { position: relative; min-width: calc(64 * var(--u)); min-height: calc(64 * var(--u)); padding: 0 var(--space-3); gap: var(--space-2); }
    .hub-more__dots { width: calc(28 * var(--u)); height: calc(28 * var(--u)); background: radial-gradient(circle, currentColor 18%, transparent 20%) 0 50% / 33.3% 100% repeat-x; }
    .hub-more__on { padding: 2px var(--space-2); border-radius: var(--radius-pill); background: var(--color-primary-tint); color: var(--color-primary); font: var(--font-weight-medium) var(--fs-caption)/1.2 var(--font-sans); }
    .hub-more__on[hidden] { display: none; }
    .hub-more[aria-expanded="true"] { background: var(--color-primary-tint); border-color: var(--color-primary); }
    .hub-pop {
      position: absolute; right: 0; top: calc(100% + var(--space-2)); z-index: 20; width: calc(600 * var(--u)); min-width: 300px;
      display: grid; gap: var(--space-3); padding: var(--space-4) var(--space-5); border-radius: var(--radius-lg);
      background: var(--color-paper-raised); border: 1px solid var(--color-line-strong); box-shadow: var(--shadow-lg);
    }
    .hub-pop[hidden] { display: none; }
    .hub-pop .hub-teacher { justify-content: space-between; min-height: calc(64 * var(--u)); font-size: var(--fs-meta); }
    .hub-pop__t { font: var(--font-weight-medium) var(--fs-caption)/1.2 var(--font-sans); color: var(--color-ink-muted); padding-top: var(--space-2); border-top: 1px solid var(--color-line); }
    .hub-pop .hub-keys { position: static; width: auto; padding: 0; border: 0; box-shadow: none; background: none; }
    /* R7-3(S9): 예전 [바로 실험][▾] 분할 단추·갈래 메뉴(card__split·card__splitbtn·card__menu) 삭제 — 갈래는 .card__forks 칩 줄 */
    .card__links { display: none; }
    .card__mid { grid-template-columns: minmax(0, 1fr); }
    /* R7-3(S9): 흐름 칩 한 줄 고정 · 제목 옆 대표 선화(가로) · 갈래 칩 줄 36u(5장 자리 예약) · 분할 단추 없음 */
    .card__steps { flex-wrap: nowrap; white-space: nowrap; gap: calc(4 * var(--u)); font-size: max(12px, calc(21 * var(--u))); }
    .card__steps span { padding: calc(3 * var(--u)) calc(6 * var(--u)); }
    .card__head { align-self: stretch; display: block; flex: none; }
    .card__head::after { content: ""; display: block; clear: both; }
    .card__icon--head { float: right; width: calc(96 * var(--u)); height: calc(56 * var(--u)); margin: calc(-4 * var(--u)) 0 0 var(--space-2); }
    .card > * { flex-shrink: 0; }
    .card > .card__mid { flex-shrink: 1; min-height: 0; }
    @media (orientation: landscape) { .card__icon--head { display: block; } }
    @media (orientation: portrait) { .card__icon--head { display: none; } }
    .card__forks { min-height: max(36px, calc(36 * var(--u))); display: flex; align-items: center; justify-content: center; gap: var(--space-1); }
    .card__fork {
      display: inline-flex; align-items: center; justify-content: center; min-height: max(36px, calc(36 * var(--u))); min-width: max(44px, calc(72 * var(--u)));
      padding: 0 var(--space-3); border-radius: var(--radius-pill); color: var(--sim-text); text-decoration: underline; text-underline-offset: calc(4 * var(--u));
      font: var(--font-weight-medium) var(--fs-caption)/1.2 var(--font-sans);
    }
    html:not(.cursor-hidden) .card__fork:hover, .card__fork:focus-visible { background: var(--sim-tint); }
    .card__forksep { font-style: normal; color: var(--color-line-strong); }
    /* R8(H1): 가로 4:3 태블릿(1024·1180)에서 카드는 내용만큼 자란다 — 질문·'무엇을 하나요'가 겹치지 않게 */
    .cards { align-items: stretch; grid-auto-rows: 1fr; }
    @media (orientation: landscape) and (max-aspect-ratio: 17/10) {
      .card { height: auto; max-height: none; }
      .card > .card__mid { flex-shrink: 0; min-height: auto; overflow: visible; }
      .card__q { -webkit-line-clamp: 3; line-clamp: 3; display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
    }
    @media (max-width: 1100px) { .card__q { font-size: max(14px, calc(22 * var(--u))); } .card__title { font-size: calc(30 * var(--u)); } }

    //   교사: html.is-teacher(성취기준 칩) + ?teacher=1, 저장 'hub.teacher'. URL ?teacher=1 이면 켜진 채

    var teacherBtn = document.getElementById('teacherBtn');
    var modeSeg = document.getElementById('modeSeg');
    var state = { teacher: false, simple: false };
    function buildQuery(base, o) {

      state.simple = !!on;
      document.documentElement.classList.toggle('is-simple', state.simple);
      var bs = modeSeg.querySelectorAll('.mode-seg__opt');
      for (var k = 0; k < bs.length; k++) bs[k].setAttribute('aria-pressed', String((bs[k].getAttribute('data-simple') === '1') === state.simple));
      applyLinks();
      if (save) { try { localStorage.setItem('physsim.mode', state.simple ? 'simple' : 'full'); } catch (err) { /* 저장 안 돼도 이번에는 적용 */ } }
    }
    teacherBtn.addEventListener('click', function (e) {
      setTeacher(!state.teacher, true);
      if (e.detail > 0) teacherBtn.blur();
    });
    Array.prototype.forEach.call(modeSeg.querySelectorAll('.mode-seg__opt'), function (b) {
      b.addEventListener('click', function (e) { setSimple(b.getAttribute('data-simple') === '1', true); if (e.detail > 0) b.blur(); });
    });
    var teacherOn = /[?&]teacher=1\b/.test(location.search);
    if (!teacherOn) { try { teacherOn = localStorage.getItem('hub.teacher') === '1'; } catch (err) { teacherOn = false; } }
    var sq = /[?&]simple=([01])\b/.exec(location.search), simpleOn = false;
    if (sq) { simpleOn = sq[1] === '1'; try { localStorage.setItem('physsim.mode', simpleOn ? 'simple' : 'full'); } catch (err) { /* 무시 */ } }
    else { try { simpleOn = localStorage.getItem('physsim.mode') === 'simple'; } catch (err) { simpleOn = false; } }
    setTeacher(teacherOn, false);
    setSimple(simpleOn, false);

    document.addEventListener('keydown', function (e) {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      var m = /^(?:Digit|Numpad)([1-5])$/.exec(e.code);
      if (m) { e.preventDefault(); location.href = openLinks[+m[1] - 1].href; return; }
      if (e.code === 'Escape') { if (openMenu) { var ob = openMenu.btn; closeMenus(); ob.focus(); } return; }
      if (openMenu && (e.code === 'ArrowDown' || e.code === 'ArrowUp')) {
        e.preventDefault();
        var items = Array.prototype.slice.call(openMenu.menu.querySelectorAll('a, button')), ix = items.indexOf(document.activeElement);
        var nx = e.code === 'ArrowDown' ? Math.min(items.length - 1, ix + 1) : Math.max(0, ix - 1);
        if (items[nx]) items[nx].focus();
        return;
      }
      if (e.code === 'KeyM' && !e.repeat) { e.preventDefault(); setSimple(!state.simple, true); return; }   // R6: 심플 ↔ 자세히
      if (e.code === 'KeyF' && !e.repeat) {
        e.preventDefault();
        var d = document, r = d.documentElement;
        try {
          if (!(d.fullscreenElement || d.webkitFullscreenElement)) (r.requestFullscreen || r.webkitRequestFullscreen).call(r);
          else (d.exitFullscreen || d.webkitExitFullscreen).call(d);
        } catch (err) { /* 지원 안 함 */ }
        return;
      }
      if (e.code === 'ArrowRight' || e.code === 'ArrowLeft' || e.code === 'PageDown' || e.code === 'PageUp') {
        e.preventDefault();
        var cur = openLinks.indexOf(document.activeElement);
        if (cur < 0) { var c = document.activeElement && document.activeElement.closest && document.activeElement.closest('.card'); if (c) cur = Array.prototype.indexOf.call(box.children, c); }
        var dir = (e.code === 'ArrowRight' || e.code === 'PageDown') ? 1 : -1;
        var next = cur < 0 ? (dir > 0 ? 0 : openLinks.length - 1) : (cur + dir + openLinks.length) % openLinks.length;
        openLinks[next].focus();
      }
    });

    var html = document.documentElement, t = 0;
    function show() { html.classList.remove('cursor-hidden'); clearTimeout(t); t = setTimeout(function () { html.classList.add('cursor-hidden'); }, 3000); }
    document.addEventListener('mousemove', show, { passive: true });
    show();
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  })();
  </script>
</body>
</html>
